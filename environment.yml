# Recorded local preprocessing/audit environment. Fresh-platform resolution untested.
# Qollab manages Qiskit/SciPy separately; no quantum provider credentials required.
name: qphylo
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11.17
  - blast=2.17.0
  - r-base=4.5.3
  - r-ape=5.8_1
  - r-phangorn=2.12.1
  - jupyterlab=4.6.4
  - ipykernel=7.4.0
